<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 二次元讨论社区</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-box">
    <h2>🌸 登录</h2>

    <div class="form-item">
      <label>用户名</label>
      <input type="text" id="username" placeholder="请输入用户名">
    </div>
    <div class="form-item">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码">
    </div>

    <button class="btn btn-primary" id="loginBtn">登 录</button>

    <div class="switch-link">
      还没有账号？<a href="/register.html">立即注册</a>
    </div>
  </div>
</div>

<div id="flashMsg" class="flash-msg" style="display:none"></div>

<script>
function showFlash(msg, type = 'success') {
  const el = document.getElementById('flashMsg');
  el.textContent = msg;
  el.className = 'flash-msg ' + type;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 2500);
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username || !password) {
    showFlash('用户名和密码不能为空', 'error');
    return;
  }

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (data.code === 0) {
      localStorage.setItem('token', data.data.token);
      localStorage.setItem('username', data.data.username);
      showFlash('登录成功，正在跳转...');
      setTimeout(() => { location.href = '/'; }, 800);
    } else {
      showFlash(data.msg || '登录失败', 'error');
    }
  } catch (e) {
    showFlash('网络错误，请稍后重试', 'error');
  }
});

// 回车登录
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});
</script>

</body>
</html>
